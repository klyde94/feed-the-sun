<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Sun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&family=Michroma&display=swap">
<link rel="stylesheet" href="style.css">
<meta name="description" content="Feed the Sun v3 : joue l'éboueur, remplis ton conteneur et lance-le dans le soleil.">
</head>
<body>
<div class="app" id="app">
  <section class="stage" id="stage">
    <canvas id="scene" aria-label="Scene"></canvas>

    <div class="hud hud-left">
      <div class="brand">Feed the Sun</div>
      <div class="credits"><span id="money">0</span><span class="unit">$</span></div>
      <div class="rates"><span id="sent">0</span> <span data-i18n="sent">déchets envoyés</span></div>
    </div>

    <div class="hud hud-right">
      <div class="eyebrow" id="planetMeta">Planète 1</div>
      <div class="planet-name" id="planetName">Ordura</div>
      <div class="sun-meta"><span class="sun-dot"></span><span id="sunMeta"></span></div>
    </div>

    <div class="hint" id="hint" hidden></div>

    <div class="loads">
      <div class="load"><div class="load-top"><span data-i18n="bag">Sac</span><span id="bagTxt">0/5</span></div><div class="bar"><div class="bar-fill load-fill" id="bagBar"></div></div></div>
      <div class="load"><div class="load-top"><span data-i18n="container">Conteneur</span><span id="contTxt">0/20</span></div><div class="bar"><div class="bar-fill load-fill" id="contBar"></div></div></div>
      <div class="load"><div class="load-top"><span data-i18n="pollution">Pollution</span><span id="pollTxt">100 %</span></div><div class="bar"><div class="bar-fill" id="pollBar"></div></div></div>
    </div>

    <button class="fire" id="launchBtn" type="button"><span data-i18n="launch">Lancer</span><kbd id="launchSub">Entrée</kbd></button>

    <div class="banner" id="banner" hidden>
      <div class="banner-title" id="bannerTitle"></div>
      <div class="banner-text" id="bannerText"></div>
      <button class="btn btn-sun" id="travelBtn" type="button"></button>
    </div>
  </section>

  <aside class="log" id="panel">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="gear" id="tabbtn-gear"><span data-i18n="tabGear">Équipement</span><span class="dot" id="gearDot" hidden></span></button>
      <button type="button" role="tab" data-tab="team" id="tabbtn-team"><span data-i18n="tabTeam">Équipe</span></button>
      <button type="button" role="tab" data-tab="opt" id="tabbtn-opt"><span data-i18n="tabOpt">Options</span></button>
    </nav>
    <div class="tab-body" id="tab-gear" role="tabpanel"></div>
    <div class="tab-body" id="tab-team" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-opt" role="tabpanel" hidden></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="world.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
</body>
</html>
