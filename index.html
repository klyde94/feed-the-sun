<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Sun</title>
<meta name="theme-color" content="#05060b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&family=Michroma&display=swap">
<link rel="stylesheet" href="style.css?v=3.1">
<meta name="description" content="Feed the Sun : commence éboueur, finis à la tête d'une flotte qui nourrit le soleil. Jeu idle gratuit, en français et en anglais.">
</head>
<body>
<div class="app" id="app">
  <section class="stage" id="stage">
    <canvas id="scene" aria-label="Scene"></canvas>

    <div class="hud hud-left">
      <div class="credits"><span id="money">0</span><span class="unit">$</span></div>
      <div class="lvl" id="lvlRow" hidden><span id="lvlTxt">Niveau 1</span><span class="pts" id="ptsTxt"></span></div>
      <div class="bar xp" id="xpRow" hidden><div class="bar-fill" id="xpBar"></div></div>
      <div class="mission" id="mission">
        <div class="mission-top"><span data-i18n="missionLabel">Mission</span><span id="missionReward"></span></div>
        <div class="mission-text" id="missionText"></div>
        <div class="bar"><div class="bar-fill" id="missionBar"></div></div>
      </div>
    </div>

    <div class="hud hud-right">
      <div class="eyebrow" id="planetMeta">Planète 1</div>
      <div class="planet-name" id="planetName">Ordura</div>
      <div class="poll"><span data-i18n="pollution">Pollution</span><span id="pollTxt">100 %</span></div>
      <div class="bar poll-bar"><div class="bar-fill" id="pollBar"></div></div>
      <div class="sun-meta"><span class="sun-dot"></span><span id="sunMeta"></span></div>
    </div>

    <div class="view-seg seg" id="viewSeg" hidden>
      <button type="button" class="seg-btn" id="viewGround" data-i18n="ground">Sol</button>
      <button type="button" class="seg-btn" id="viewOrbit" data-i18n="orbit">Orbite</button>
    </div>
    <div class="boost" id="boost" hidden></div>
    <div class="hint" id="hint" hidden></div>

    <button class="fire" id="launchBtn" type="button"><span data-i18n="launch">Lancer</span><kbd data-i18n="launchKey">Entrée</kbd></button>

    <div class="banner" id="banner" hidden>
      <div class="banner-title" id="bannerTitle"></div>
      <div class="banner-text" id="bannerText"></div>
      <button class="btn btn-sun" id="travelBtn" type="button"></button>
    </div>
  </section>

  <aside class="log" id="panel">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="shop"><span data-i18n="tabShop">Améliorer</span><span class="dot" id="dot-shop" hidden></span></button>
      <button type="button" role="tab" data-tab="trees" hidden><span data-i18n="tabTrees">Arbres</span><span class="dot" id="dot-trees" hidden></span></button>
      <button type="button" role="tab" data-tab="galaxy" hidden><span data-i18n="tabGalaxy">Galaxie</span><span class="dot" id="dot-galaxy" hidden></span></button>
      <button type="button" role="tab" data-tab="opt"><span data-i18n="tabOpt">Réglages</span></button>
    </nav>
    <div class="tab-body" id="tab-shop" role="tabpanel"></div>
    <div class="tab-body" id="tab-trees" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-galaxy" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-opt" role="tabpanel" hidden></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="data.js?v=3.1"></script>
<script src="i18n.js?v=3.1"></script>
<script src="world.js?v=3.1"></script>
<script src="render.js?v=3.1"></script>
<script src="orbit.js?v=3.1"></script>
<script src="panels.js?v=3.1"></script>
<script src="ui.js?v=3.1"></script>
</body>
</html>
