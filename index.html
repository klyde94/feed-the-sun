<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Sun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&family=Michroma&display=swap">
<link rel="stylesheet" href="style.css">
<meta name="description" content="Feed the Sun : un jeu idle spatial. Tire les déchets d'une planète polluée dans le soleil.">
</head>
<body>
<div class="app" id="app">
  <section class="stage" id="stage">
    <canvas id="scene" aria-label="Scene"></canvas>

    <div class="hud hud-left">
      <div class="brand">Feed the Sun</div>
      <div class="credits"><span id="credits">0</span><span class="unit">cr</span></div>
      <div class="rates"><span id="cps">0</span> <span data-i18n="crPerSec">cr/s</span><span class="sep">·</span><span id="tps">0</span> <span data-i18n="tPerSec">t/s</span></div>
    </div>

    <div class="hud hud-right">
      <div class="eyebrow" id="planetMeta">Planète 1 · Galaxie I</div>
      <div class="planet-name" id="planetName">Ordura</div>
      <div class="sun-meta"><span class="sun-dot"></span><span id="sunMeta">Naine rouge · 3 200 K</span></div>
    </div>

    <div class="buffs" id="buffs"></div>
    <div class="hint" id="hint" hidden></div>

    <div class="pollution">
      <div class="pollution-top"><span data-i18n="pollution">Pollution</span><span id="pollPct">100 %</span></div>
      <div class="bar"><div class="bar-fill" id="pollBar"></div></div>
      <div class="pollution-sub" id="pollSub"></div>
    </div>

    <button class="fire" id="fireBtn" type="button"><span data-i18n="fire">Tirer</span><kbd data-i18n="space">Espace</kbd></button>

    <div class="banner" id="banner" hidden>
      <div class="banner-title" id="bannerTitle"></div>
      <div class="banner-text" id="bannerText"></div>
      <button class="btn btn-sun" id="travelBtn" type="button"></button>
    </div>
  </section>

  <aside class="log" id="panel">
    <nav class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="fleet" id="tabbtn-fleet"><span data-i18n="tabFleet">Flotte</span></button>
      <button type="button" role="tab" data-tab="ups" id="tabbtn-ups"><span data-i18n="tabUps">Améliorations</span><span class="dot" id="upsDot" hidden></span></button>
      <button type="button" role="tab" data-tab="galaxy" id="tabbtn-galaxy"><span data-i18n="tabGalaxy">Galaxie</span><span class="dot" id="galaxyDot" hidden></span></button>
      <button type="button" role="tab" data-tab="ach" id="tabbtn-ach"><span data-i18n="tabAch">Succès</span></button>
      <button type="button" role="tab" data-tab="opt" id="tabbtn-opt"><span data-i18n="tabOpt">Options</span></button>
    </nav>
    <div class="tab-body" id="tab-fleet" role="tabpanel"></div>
    <div class="tab-body" id="tab-ups" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-galaxy" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-ach" role="tabpanel" hidden></div>
    <div class="tab-body" id="tab-opt" role="tabpanel" hidden></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="scene.js"></script>
<script src="ui.js"></script>
</body>
</html>
